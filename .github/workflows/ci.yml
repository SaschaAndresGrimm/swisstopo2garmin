name: CI

# Markdown-only pushes are skipped: no job here reads a `.md` file. The doc generators
# under `spikes/` and `tools/` write them and are not part of any check, so a prose
# commit cannot break a build. `docs/tlm3d-schema.json` is deliberately *not* ignored —
# that one is a data file the code is held against (working agreement rule 2).
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  # The weekly run is what keeps macOS covered; see the `targets` job below.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# A superseded pull-request run is cancelled, because only the latest push to a branch
# is worth paying for. Pushes to `main` are deliberately *not* cancelled: the working
# agreement is that every commit on main compiles and passes tests (rule 4), and
# cancelling would leave commits with no verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Which platforms this run tests.
  #
  # macOS runners bill at ten times the Linux rate, and measured against a real green
  # run the two of them were 60 of the 84 billable minutes a single push cost — 71 % of
  # the bill for two of the nine jobs. That is what exhausted the account's Actions
  # budget on 2026-09-07, and it bought less than it looks:
  #
  #   * `macos-14` is arm64, which is what this project is developed on. It re-tested
  #     what the author's own machine had already run, at ten times the price. It is no
  #     longer in CI at all; `release.yml` still builds and ships an arm64 bundle, so
  #     the artefact is still produced and still verified on a tag.
  #   * `macos-15-intel` is x86_64 macOS, which nothing else covers. It is worth paying
  #     for, but not on every push — so it runs weekly and on demand.
  #
  # A computed matrix rather than a second copy of the job: the steps below vendor a JRE
  # and mkgmap and have grown particular, and two divergent copies of that is a worse
  # problem than one indirection.
  targets:
    name: platforms
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'os=["ubuntu-latest","windows-latest","macos-15-intel"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: rust (${{ matrix.os }})
    needs: targets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.targets.outputs.os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # tauri.conf.json declares the vendored toolchain as bundle resources (NFR-7), and
      # tauri-build checks a declared resource exists -- so src-tauri does not compile
      # without it. Fetching it here has a second, larger benefit: the tests that need
      # mkgmap were silently skipping in CI with "toolchain not vendored", so the real
      # compile path was never exercised by any run.
      - name: Cache the vendored toolchain
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/mkgmap-r4924
            vendor/splitter-r654
            vendor/jre
            vendor/toolchain.env
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/fetch_tools.py') }}

      - name: Vendor the Garmin toolchain and JRE
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: python3 vendor/fetch_tools.py

      - name: Linux system dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Excludes tests/live.rs, which is #[ignore]d and needs network: CI must be
      # offline and deterministic (PLAN.md M1 task 3). With the toolchain vendored above,
      # the tests that compile a real map with mkgmap now run instead of skipping.
      - name: Test
        run: cargo test --workspace

      - name: IPC bindings are up to date
        shell: bash
        run: |
          cargo test -p swisstopo2garmin
          if ! git diff --quiet -- frontend/src/state/bindings.ts; then
            echo "::error::frontend/src/state/bindings.ts is stale."
            echo "Run: cargo test -p swisstopo2garmin && commit the result."
            git diff -- frontend/src/state/bindings.ts
            exit 1
          fi

  workflows:
    name: workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A workflow only fails when it runs, and the release workflow runs on a tag --
      # so a mistake in it is discovered at the worst possible moment. actionlint checks
      # expression syntax, action inputs and runner labels statically. It immediately
      # found that both workflows still named `macos-13`, which GitHub has retired.
      # The upstream download script rather than a third-party wrapper action: one fewer
      # thing to trust, and `rhysd/actionlint` publishes no action of its own -- an
      # earlier draft of this file referenced one that does not exist.
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # These two existed from Milestone 6 and were never wired in, so nothing ran them.
      # English is the fallback (FR-4): a missing German key renders the English string,
      # and a half-translated screen looks finished to anybody testing in English.
      - run: npm run check:i18n
        working-directory: frontend
      # Static only -- control names, labels, live regions. Not a screen-reader pass;
      # docs/accessibility.md says what is still missing.
      - run: npm run check:a11y
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  performance:
    name: performance thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Release, because the ceilings are calibrated against an optimised build -- the
      # test skips its rate assertions otherwise rather than measuring the wrong thing.
      # Linux, because it is the only platform in the matrix that reports a true peak RSS
      # (VmHWM), which is what NFR-2 is about.
      #
      # Scale is the honest limitation: CI is offline, so the canton and national budgets
      # of NFR-1 are checked by extrapolating a rate measured on the committed 1 km2
      # fixture. See docs/performance.md.
      - name: Rates and peak memory (NFR-1, NFR-2)
        run: cargo test --release -p s2g-core --test perf -- --nocapture

      # FR-60's ±25% over the committed reference manifests. Offline and instant: a
      # manifest carries the predictors and the actual size, so no build is needed.
      - name: Size estimates hold on the reference suite (FR-60)
        run: cargo test --release -p s2g-core --test estimator_reference -- --nocapture

  cartography:
    name: cartography consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A polygon type emitted by the style but missing from the TYP's [_drawOrder]
      # is invisible on the device and invisible in the .img -- only this catches it.
      # See docs/m0-findings.md §4.8.
      - name: Regenerate TYP from the measured palette
        run: python3 tools/make_typ.py
      - name: TYP matches the style
        run: python3 spikes/s0/checkstyle.py
  supply-chain:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # node_modules is where npm licences are actually readable: the lock file records
      # one for only some packages.
      - run: npm ci
        working-directory: frontend

      # The vendored Java tools are the largest components in the bundle and the only
      # GPL-2 ones, and both package managers are blind to them, so an SBOM that omits
      # them omits the part a redistributor most needs (NFR-10).
      - name: Fetch the vendored toolchain
        run: python3 vendor/fetch_tools.py

      - name: SBOM resolves every shipped component
        run: python3 tools/sbom.py --check

      - name: Generate the SBOM
        run: python3 tools/sbom.py > sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: TYP is in sync with palette.json
        run: |
          if ! git diff --quiet -- typ/swisstopo.txt; then
            echo "::error::typ/swisstopo.txt is stale. Run tools/make_typ.py and commit."
            git diff -- typ/swisstopo.txt
            exit 1
          fi
